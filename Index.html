<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MZEKNI</title>
    <style>
        :root { --bg: #000; --yellow: #fbc02d; --gray: #1a1a1a; --green: #2ecc71; --red: #e74c3c; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        
        .logo { color: var(--yellow); font-size: 28px; font-weight: 900; margin: 20px 0; letter-spacing: -1px; text-transform: uppercase; }
        
        /* Search Box */
        .search-container { width: 100%; max-width: 400px; position: relative; z-index: 100; }
        input { width: 100%; padding: 15px; border-radius: 30px; border: 1px solid #333; background: var(--gray); color: white; outline: none; box-sizing: border-box; font-size: 16px; }
        #artistList { position: absolute; top: 100%; left: 0; right: 0; background: #222; border-radius: 15px; margin-top: 10px; max-height: 250px; overflow-y: auto; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .artist-option { padding: 12px 20px; border-bottom: 1px solid #333; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
        .artist-option:hover { background: #333; }

        /* Game UI */
        #game { display: none; width: 100%; max-width: 500px; text-align: center; margin-top: 30px; }
        .funny-phrase { font-size: 38px; font-weight: 900; margin: 0; text-transform: uppercase; line-height: 1.1; }
        .sub { color: var(--yellow); margin: 15px 0 35px 0; font-weight: 600; font-size: 14px; }
        
        /* Player Icon */
        .player-row { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 40px; }
        #playBtn { background: none; border: none; cursor: pointer; padding: 0; }
        #playBtn svg { width: 65px; height: 65px; fill: var(--yellow); }
        .bars { display: flex; gap: 4px; height: 35px; align-items: center; }
        .bar { width: 4px; height: 12px; background: #333; border-radius: 2px; }

        /* Choice Grid */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .card { cursor: pointer; transition: 0.2s; }
        .card img { width: 100%; aspect-ratio: 1/1; border-radius: 15px; object-fit: cover; border: 3px solid transparent; }
        .card p { font-size: 12px; margin-top: 10px; color: #fff; font-weight: 500; }
        
        /* Status States */
        .correct img { border-color: var(--green) !important; }
        .wrong img { border-color: var(--red) !important; opacity: 0.4; }
        .reveal img { border-color: var(--green) !important; opacity: 1; }
        
        #msg { height: 40px; margin-top: 25px; font-weight: 800; font-size: 20px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="logo">MZEKNI</div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search a singer..." oninput="searchArtists()" autocomplete="off">
        <div id="artistList"></div>
    </div>

    <div id="game">
        <h1 class="funny-phrase">GUESS THE SONG, BABY!</h1>
        <p class="sub">Play the track and pick the right song name</p>

        <div class="player-row">
            <button id="playBtn">
                <svg id="svgIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <div class="bars" id="visualizer"></div>
        </div>

        <div id="grid" class="grid"></div>
        <div id="msg"></div>
    </div>

    <script>
        let fullSongList = [];
        let goalTrack = null;
        const audio = new Audio();

        // Visualizer Setup
        const viz = document.getElementById('visualizer');
        for(let i=0; i<12; i++) {
            const b = document.createElement('div');
            b.className = 'bar';
            viz.appendChild(b);
        }

        async function searchArtists() {
            const term = document.getElementById('searchInput').value;
            if (term.length < 2) {
                document.getElementById('artistList').style.display = 'none';
                return;
            }

            // Search specifically for music artists to ensure official results
            const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&entity=musicArtist&limit=5`);
            const data = await res.json();
            const list = document.getElementById('artistList');
            list.innerHTML = '';
            
            data.results.forEach(artist => {
                const div = document.createElement('div');
                div.className = 'artist-option';
                div.innerHTML = `${artist.artistName} <span>${artist.primaryGenreName}</span>`;
                div.onclick = () => selectArtist(artist.artistId);
                list.appendChild(div);
            });
            list.style.display = 'block';
        }

        async function selectArtist(id) {
            document.getElementById('artistList').style.display = 'none';
            document.getElementById('searchInput').value = "";
            
            // Fetch a much larger set of tracks (limit 200) to prevent repeating the same 3 songs
            const res = await fetch(`https://itunes.apple.com/lookup?id=${id}&entity=song&limit=200`);
            const data = await res.json();
            
            // Filter out non-track items and ensure they have audio previews
            fullSongList = data.results.filter(item => item.wrapperType === 'track' && item.previewUrl);
            
            if (fullSongList.length < 3) {
                alert("This artist doesn't have enough official previews. Try another!");
                return;
            }
            
            document.getElementById('game').style.display = 'block';
            loadRound();
        }

        function loadRound() {
            document.getElementById('msg').innerText = '';
            
            // Shuffle full pool and pick 3 unique tracks
            const shuffled = [...fullSongList].sort(() => 0.5 - Math.random());
            const selection = [];
            const titles = new Set();

            for (let track of shuffled) {
                if (!titles.has(track.trackName.toLowerCase())) {
                    selection.push(track);
                    titles.add(track.trackName.toLowerCase());
                }
                if (selection.length === 3) break;
            }

            goalTrack = selection[Math.floor(Math.random() * 3)];
            audio.src = goalTrack.previewUrl;
            
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            selection.forEach(track => {
                const div = document.createElement('div');
                div.className = 'card';
                div.id = `t-${track.trackId}`;
                const highResImg = track.artworkUrl100.replace('100x100', '400x400');
                div.innerHTML = `<img src="${highResImg}"><p>${track.trackName}</p>`;
                div.onclick = () => check(track, div);
                grid.appendChild(div);
            });
            
            setPlaying(false);
        }

        function check(track, el) {
            if (document.getElementById('msg').innerText !== '') return;

            if (track.trackId === goalTrack.trackId) {
                el.classList.add('correct');
                document.getElementById('msg').innerText = "Correct, Baby!";
                document.getElementById('msg').style.color = "var(--green)";
            } else {
                el.classList.add('wrong');
                document.getElementById(`t-${goalTrack.trackId}`).classList.add('reveal');
                document.getElementById('msg').innerText = `Wrong! It was ${goalTrack.trackName}`;
                document.getElementById('msg').style.color = "var(--red)";
            }

            audio.pause();
            setPlaying(false);
            setTimeout(loadRound, 2500);
        }

        function setPlaying(isPlaying) {
            const icon = document.getElementById('svgIcon');
            icon.innerHTML = isPlaying 
                ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' 
                : '<path d="M8 5v14l11-7z"/>';
            document.querySelectorAll('.bar').forEach(b => {
                b.style.height = isPlaying ? (Math.random()*25+5)+'px' : '12px';
                b.style.background = isPlaying ? 'var(--yellow)' : '#333';
            });
        }

        document.getElementById('playBtn').onclick = () => {
            if (audio.paused) { audio.play(); setPlaying(true); } 
            else { audio.pause(); setPlaying(false); }
        };

        audio.onended = () => setPlaying(false);
    </script>
</body>
</html>
