<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MZEKNI</title>
    <style>
        :root { --bg: #000; --yellow: #fbc02d; --gray: #1a1a1a; --green: #2ecc71; --red: #e74c3c; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        
        .logo { color: var(--yellow); font-size: 32px; font-weight: 900; margin: 20px 0; text-transform: uppercase; }

        /* Mode Selector */
        .mode-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .mode-btn { background: #333; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .mode-btn.active { background: var(--yellow); color: black; }

        /* Stats & Timer */
        .stats { display: flex; gap: 20px; color: var(--yellow); font-weight: bold; margin-bottom: 10px; }
        .timer-box { width: 100%; max-width: 400px; height: 6px; background: #333; border-radius: 3px; margin-bottom: 25px; overflow: hidden; }
        #timer-fill { height: 100%; width: 100%; background: var(--yellow); transition: width 0.1s linear; }

        /* Search Area */
        .search-container { width: 100%; max-width: 400px; position: relative; margin-bottom: 20px; }
        input { width: 100%; padding: 15px; border-radius: 30px; border: 1px solid #333; background: var(--gray); color: white; outline: none; box-sizing: border-box; }
        #artistList { position: absolute; top: 100%; left: 0; right: 0; background: #222; border-radius: 15px; margin-top: 10px; max-height: 200px; overflow-y: auto; display: none; z-index: 100; }
        .artist-option { padding: 12px 20px; border-bottom: 1px solid #333; cursor: pointer; }

        #game { display: none; width: 100%; max-width: 500px; text-align: center; }
        .headline { font-size: 42px; font-weight: 900; margin: 10px 0; line-height: 1; text-transform: uppercase; }
        .subline { color: var(--yellow); font-size: 18px; font-weight: bold; margin-bottom: 30px; }

        /* Sound Mode UI */
        #playBtn { background: none; border: none; cursor: pointer; margin-bottom: 20px; }
        #playBtn svg { width: 70px; height: 70px; fill: var(--yellow); }

        /* Lyrics Mode UI */
        #lyrics-box { background: #111; padding: 30px 20px; border-radius: 15px; margin-bottom: 30px; display: none; border-left: 5px solid var(--yellow); font-style: italic; font-size: 20px; }

        /* The Grid */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .card { cursor: pointer; text-align: center; }
        .card img { width: 100%; aspect-ratio: 1/1; border-radius: 15px; object-fit: cover; border: 4px solid transparent; }
        .card p { font-size: 12px; margin-top: 8px; color: #bbb; font-weight: 500; }
        
        .correct img { border-color: var(--green) !important; }
        .wrong img { border-color: var(--red) !important; opacity: 0.4; }
        .reveal img { border-color: var(--green) !important; opacity: 1; }
        
        /* Result Screen */
        #results { display: none; text-align: center; }
        .rank { font-size: 60px; color: var(--yellow); font-weight: 900; margin: 20px 0; }
        .share-btn { background: #25D366; color: white; padding: 15px 30px; border-radius: 30px; border: none; font-weight: 900; cursor: pointer; font-size: 18px; }
    </style>
</head>
<body>

    <div class="logo">MZEKNI</div>

    <div class="mode-container">
        <button class="mode-btn active" id="btnSound" onclick="changeMode('sound')">SOUND MODE</button>
        <button class="mode-btn" id="btnLyrics" onclick="changeMode('lyrics')">LYRICS MODE</button>
    </div>

    <div class="stats" id="statsBox" style="display:none;">
        <span>ROUND <span id="roundCount">1</span>/10</span>
        <span>🔥 <span id="currentScore">0</span></span>
    </div>

    <div class="timer-box" id="timerBox" style="display:none;">
        <div id="timer-fill"></div>
    </div>

    <div class="search-container" id="searchBox">
        <input type="text" id="searchInput" placeholder="Search a singer..." oninput="searchArtists()">
        <div id="artistList"></div>
    </div>

    <div id="game">
        <h1 class="headline">GUESS THE SONG, BABY!</h1>
        <p class="subline">Play the track and pick the right song name</p>

        <div id="sound-ui">
            <button id="playBtn"><svg id="svgIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        </div>

        <div id="lyrics-ui">
            <div id="lyrics-box">"Loading lyrics..."</div>
        </div>

        <div id="grid" class="grid"></div>
        <div id="msg" style="margin-top: 20px; font-weight: 900; height: 30px;"></div>
    </div>

    <div id="results">
        <h1 class="headline">FINISHED!</h1>
        <div class="rank" id="finalRank">0/10</div>
        <button class="share-btn" onclick="share()">SHARE ON WHATSAPP</button>
        <p onclick="location.reload()" style="margin-top:20px; color:#888; cursor:pointer;">Try Again</p>
    </div>

    <script>
        let tracks = [], goal = null, round = 1, score = 0, gameMode = 'sound';
        let timer, timeLeft = 15;
        const audio = new Audio();

        function changeMode(m) {
            gameMode = m;
            document.getElementById('btnSound').classList.toggle('active', m === 'sound');
            document.getElementById('btnLyrics').classList.toggle('active', m === 'lyrics');
            if (tracks.length > 0) loadRound();
        }

        async function searchArtists() {
            const val = document.getElementById('searchInput').value;
            if (val.length < 2) return;
            const res = await fetch(`https://itunes.apple.com/search?term=${val}&entity=musicArtist&limit=5`);
            const data = await res.json();
            const list = document.getElementById('artistList');
            list.innerHTML = '';
            data.results.forEach(a => {
                const d = document.createElement('div');
                d.className = 'artist-option';
                d.innerText = a.artistName;
                d.onclick = () => startChallenge(a.artistId);
                list.appendChild(d);
            });
            list.style.display = 'block';
        }

        async function startChallenge(id) {
            document.getElementById('searchBox').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            document.getElementById('statsBox').style.display = 'flex';
            document.getElementById('timerBox').style.display = 'block';
            const res = await fetch(`https://itunes.apple.com/lookup?id=${id}&entity=song&limit=100`);
            const data = await res.json();
            tracks = data.results.filter(t => t.wrapperType === 'track');
            loadRound();
        }

        function loadRound() {
            if (round > 10) return showFinal();
            clearInterval(timer);
            audio.pause();
            document.getElementById('msg').innerText = '';
            document.getElementById('roundCount').innerText = round;

            document.getElementById('sound-ui').style.display = gameMode === 'sound' ? 'block' : 'none';
            document.getElementById('lyrics-box').style.display = gameMode === 'lyrics' ? 'block' : 'none';

            let selection = [...tracks].sort(() => 0.5 - Math.random()).slice(0, 3);
            goal = selection[Math.floor(Math.random() * 3)];
            
            if (gameMode === 'sound') {
                audio.src = goal.previewUrl;
                updateIcon(false);
            } else {
                document.getElementById('lyrics-box').innerText = `🎵 [Singing the title or chorus of "${goal.trackName}"]...`;
            }

            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            selection.forEach(t => {
                const d = document.createElement('div');
                d.className = 'card';
                d.id = `t-${t.trackId}`;
                d.innerHTML = `<img src="${t.artworkUrl100.replace('100x100','400x400')}"><p>${t.trackName}</p>`;
                d.onclick = () => check(t, d);
                grid.appendChild(d);
            });
            startTimer();
        }

        function startTimer() {
            timeLeft = 15;
            document.getElementById('timer-fill').style.width = '100%';
            timer = setInterval(() => {
                timeLeft -= 0.1;
                document.getElementById('timer-fill').style.width = (timeLeft/15*100)+'%';
                if(timeLeft <= 0) { clearInterval(timer); check(null, null); }
            }, 100);
        }

        function check(t, el) {
            clearInterval(timer);
            if (document.getElementById('msg').innerText !== '') return;

            if (t && t.trackId === goal.trackId) {
                el.classList.add('correct');
                score++;
                document.getElementById('msg').innerText = "CORRECT! 🔥";
            } else {
                if(el) el.classList.add('wrong');
                document.getElementById(`t-${goal.trackId}`).classList.add('reveal');
                document.getElementById('msg').innerText = "WRONG! ❌";
            }
            document.getElementById('currentScore').innerText = score;
            round++;
            setTimeout(loadRound, 2000);
        }

        function showFinal() {
            document.getElementById('game').style.display = 'none';
            document.getElementById('timerBox').style.display = 'none';
            document.getElementById('results').style.display = 'block';
            document.getElementById('finalRank').innerText = `${score}/10`;
        }

        function share() {
            const txt = `I just got ${score}/10 on MZEKNI! Can you beat me?`;
            window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`);
        }

        function updateIcon(p) {
            document.getElementById('svgIcon').innerHTML = p ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
        }

        document.getElementById('playBtn').onclick = () => {
            if (audio.paused) { audio.play(); updateIcon(true); } else { audio.pause(); updateIcon(false); }
        };
    </script>
</body>
</html>
