<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MZEKNI</title>
    <style>
        :root { --bg: #000; --yellow: #fbc02d; --green: #2ecc71; --red: #e74c3c; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        
        .logo { color: var(--yellow); font-size: 32px; font-weight: 900; margin: 10px 0; text-transform: uppercase; }

        /* Timer & Stats Area */
        #game-header { display: none; width: 100%; max-width: 400px; flex-direction: column; }
        .stats-row { display: flex; justify-content: space-between; color: var(--yellow); font-weight: 800; margin-bottom: 8px; }
        .timer-bar { width: 100%; height: 6px; background: #333; border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
        #timer-fill { height: 100%; width: 100%; background: var(--yellow); transition: width 0.1s linear; }

        /* Enhanced Search Section */
        .search-container { width: 100%; max-width: 400px; position: relative; margin-top: 10px; }
        input { width: 100%; padding: 15px 20px; border-radius: 30px; border: 1px solid #333; background: #1a1a1a; color: white; outline: none; box-sizing: border-box; }
        #artistList { position: absolute; width: 100%; background: #111; border-radius: 15px; margin-top: 10px; z-index: 100; border: 1px solid #333; display: none; overflow: hidden; }
        
        /* New Information Columns for Search */
        .artist-item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #222; cursor: pointer; gap: 15px; background: #111; }
        .artist-item img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid #333; }
        .info-col { display: flex; flex-direction: column; flex-grow: 1; }
        .artist-name { font-weight: bold; font-size: 16px; color: white; }
        .artist-genre { font-size: 11px; color: var(--yellow); text-transform: uppercase; font-weight: 800; }
        .view-link { font-size: 10px; color: #555; text-decoration: underline; margin-top: 2px; }

        /* FIXED GRID - Same Size Images */
        #game-area { display: none; width: 100%; max-width: 450px; text-align: center; }
        .song-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; align-items: start; }
        .song-card { cursor: pointer; width: 100%; }
        .song-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 12px; border: 4px solid transparent; display: block; box-sizing: border-box; }
        
        .song-card p { 
            font-size: 11px; margin-top: 8px; color: #aaa; font-weight: 700; height: 2.4em; 
            overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.2em; 
        }
        
        .correct img { border-color: var(--green) !important; }
        .wrong img { border-color: var(--red) !important; opacity: 0.4; }
        .reveal img { border-color: var(--green) !important; opacity: 1; }
        
        #playBtn { background: none; border: none; cursor: pointer; margin: 15px 0; }
        #playBtn svg { width: 70px; height: 70px; fill: var(--yellow); }
        #feedback { height: 25px; margin-top: 10px; font-weight: 900; color: var(--yellow); }

        /* Final Rank */
        #final-screen { display: none; text-align: center; margin-top: 50px; }
        .final-score { font-size: 80px; font-weight: 900; color: var(--yellow); margin: 20px 0; }
        .share-btn { background: #25D366; color: white; padding: 18px 40px; border-radius: 40px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="logo">MZEKNI</div>

    <div id="game-header">
        <div class="stats-row">
            <span>ROUND <span id="rNum">1</span>/10</span>
            <span>SCORE: <span id="sNum">0</span></span>
        </div>
        <div class="timer-bar"><div id="timer-fill"></div></div>
    </div>

    <div class="search-container" id="sCont">
        <input type="text" id="aInp" placeholder="Search singer (e.g. Pause)..." oninput="getArtists()">
        <div id="artistList"></div>
    </div>

    <div id="game-area">
        <h1 style="font-size: 32px; font-weight: 900; margin: 10px 0;">GUESS THE SONG!</h1>
        <button id="playBtn"><svg id="pIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <div id="grid" class="song-grid"></div>
        <div id="feedback"></div>
    </div>

    <div id="final-screen">
        <h1 style="font-weight: 900;">CHALLENGE OVER</h1>
        <div class="final-score" id="fScore">0/10</div>
        <button class="share-btn" onclick="shareWA()">SHARE ON WHATSAPP</button>
        <p onclick="location.reload()" style="margin-top:30px; color:#555; cursor:pointer;">Restart</p>
    </div>

    <script>
        let pool = [], target = null, r = 1, s = 0, timer, time = 15;
        const player = new Audio();

        async function getArtists() {
            const q = document.getElementById('aInp').value;
            if (q.length < 2) return;
            const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=musicArtist&limit=6`);
            const data = await res.json();
            const list = document.getElementById('artistList');
            list.innerHTML = '';
            
            data.results.forEach(a => {
                const div = document.createElement('div');
                div.className = 'artist-item';
                const pic = `https://ui-avatars.com/api/?name=${encodeURIComponent(a.artistName)}&background=333&color=fbc02d&bold=true`;
                
                div.innerHTML = `
                    <img src="${pic}">
                    <div class="info-col">
                        <span class="artist-name">${a.artistName}</span>
                        <span class="artist-genre">${a.primaryGenreName || 'Musician'}</span>
                        <span class="view-link">Identify Artist Profile</span>
                    </div>
                `;
                div.onclick = () => loadGame(a.artistId);
                list.appendChild(div);
            });
            list.style.display = 'block';
        }

        async function loadGame(id) {
            document.getElementById('sCont').style.display = 'none';
            document.getElementById('game-header').style.display = 'flex';
            document.getElementById('game-area').style.display = 'block';
            const res = await fetch(`https://itunes.apple.com/lookup?id=${id}&entity=song&limit=100`);
            const data = await res.json();
            pool = data.results.filter(x => x.previewUrl);
            playRound();
        }

        function playRound() {
            if (r > 10) return gameOver();
            clearInterval(timer);
            player.pause();
            document.getElementById('feedback').innerText = '';
            document.getElementById('rNum').innerText = r;
            
            let choices = [...pool].sort(() => 0.5 - Math.random()).slice(0, 3);
            target = choices[Math.floor(Math.random() * 3)];
            player.src = target.previewUrl;
            
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            choices.forEach(track => {
                const card = document.createElement('div');
                card.className = 'song-card';
                card.id = `s-${track.trackId}`;
                card.innerHTML = `<img src="${track.artworkUrl100.replace('100x100','400x400')}"><p>${track.trackName}</p>`;
                card.onclick = () => select(track, card);
                grid.appendChild(card);
            });
            startClock();
        }

        function startClock() {
            time = 15;
            document.getElementById('timer-fill').style.width = '100%';
            timer = setInterval(() => {
                time -= 0.1;
                document.getElementById('timer-fill').style.width = (time / 15 * 100) + '%';
                if (time <= 0) { clearInterval(timer); select(null, null); }
            }, 100);
        }

        function select(track, el) {
            clearInterval(timer);
            if (document.getElementById('feedback').innerText !== '') return;
            if (track && track.trackId === target.trackId) {
                el.classList.add('correct');
                s++;
                document.getElementById('feedback').innerText = "CORRECT!";
            } else {
                if(el) el.classList.add('wrong');
                document.getElementById(`s-${target.trackId}`).classList.add('reveal');
                document.getElementById('feedback').innerText = "WRONG!";
            }
            document.getElementById('sNum').innerText = s;
            r++;
            setTimeout(playRound, 2000);
        }

        function gameOver() {
            document.getElementById('game-area').style.display = 'none';
            document.getElementById('game-header').style.display = 'none';
            document.getElementById('final-screen').style.display = 'block';
            document.getElementById('fScore').innerText = `${s}/10`;
        }

        function shareWA() {
            const url = `https://wa.me/?text=${encodeURIComponent('I got ' + s + '/10 on MZEKNI! Beat me! 🎵 mzekni.netlify.app 🩵')}`;
            window.open(url);
        }

        document.getElementById('playBtn').onclick = () => {
            if (player.paused) { player.play(); document.getElementById('pIcon').innerHTML='<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; }
            else { player.pause(); document.getElementById('pIcon').innerHTML='<path d="M8 5v14l11-7z"/>'; }
        };
    </script>
</body>
</html>
