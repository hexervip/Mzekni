<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MZEKNI ULTIMATE</title>
    <style>
        :root { --bg: #0b0b0b; --yellow: #fbc02d; --green: #2ecc71; --red: #e74c3c; }
        body { background: var(--bg); color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .logo { color: var(--yellow); font-size: 32px; font-weight: 900; margin-bottom: 20px; }
        
        /* SEARCH BOX - MUST WORK FIRST */
        .search-container { width: 100%; max-width: 400px; position: relative; margin-bottom: 20px; }
        input { width: 100%; padding: 15px; border-radius: 30px; border: 1px solid #444; background: #222; color: white; }
        #artistList { background: #333; position: absolute; width: 100%; border-radius: 10px; z-index: 10; display: none; }
        .artist-opt { padding: 10px; border-bottom: 1px solid #444; cursor: pointer; }

        /* GAME UI - HIDDEN UNTIL SEARCH */
        #game { display: none; width: 100%; max-width: 500px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .card img { width: 100%; border-radius: 10px; cursor: pointer; border: 3px solid transparent; }
        .correct img { border-color: var(--green); }
        .wrong img { border-color: var(--red); opacity: 0.5; }
        
        #lyrics-box { background: #1a1a1a; padding: 20px; border-radius: 10px; margin: 20px 0; display: none; font-style: italic; }
    </style>
</head>
<body>

    <div class="logo">MZEKNI</div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Type artist name (e.g. Drake)..." oninput="search()">
        <div id="artistList"></div>
    </div>

    <div id="game">
        <div id="round-info">Round 1/10 | Score: 0</div>
        
        <div id="audio-ui">
            <button onclick="toggleAudio()" style="background:var(--yellow); padding:15px; border-radius:50%; border:none; cursor:pointer;">▶ PLAY PREVIEW</button>
        </div>

        <div id="lyrics-box">"Snippet of lyrics goes here..."</div>

        <div id="grid" class="grid"></div>
        <div id="msg" style="margin-top:20px; font-weight:bold;"></div>
    </div>

    <script>
        let tracks = [], goal = null, round = 1, score = 0;
        const audio = new Audio();

        async function search() {
            const val = document.getElementById('searchInput').value;
            if (val.length < 2) return;
            const res = await fetch(`https://itunes.apple.com/search?term=${val}&entity=musicArtist&limit=5`);
            const data = await res.json();
            const list = document.getElementById('artistList');
            list.innerHTML = '';
            data.results.forEach(a => {
                const d = document.createElement('div');
                d.className = 'artist-opt';
                d.innerText = a.artistName;
                d.onclick = () => start(a.artistId);
                list.appendChild(d);
            });
            list.style.display = 'block';
        }

        async function start(id) {
            document.getElementById('artistList').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            const res = await fetch(`https://itunes.apple.com/lookup?id=${id}&entity=song&limit=50`);
            const data = await res.json();
            tracks = data.results.filter(t => t.wrapperType === 'track');
            loadRound();
        }

        function loadRound() {
            if (round > 10) return alert(`Game Over! Final Score: ${score}/10`);
            document.getElementById('msg').innerText = '';
            let selection = [...tracks].sort(() => 0.5 - Math.random()).slice(0, 3);
            goal = selection[Math.floor(Math.random() * 3)];
            audio.src = goal.previewUrl;
            
            // Re-render the grid
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            selection.forEach(t => {
                const img = document.createElement('img');
                img.src = t.artworkUrl100.replace('100x100','300x300');
                const card = document.createElement('div');
                card.className = 'card';
                card.appendChild(img);
                card.onclick = () => check(t, card);
                grid.appendChild(card);
            });
        }

        function check(t, el) {
            if (t.trackId === goal.trackId) {
                el.classList.add('correct');
                score++;
            } else {
                el.classList.add('wrong');
            }
            round++;
            document.getElementById('round-info').innerText = `Round ${round}/10 | Score: ${score}`;
            setTimeout(loadRound, 1500);
        }

        function toggleAudio() {
            if (audio.paused) audio.play();
            else audio.pause();
        }
    </script>
</body>
</html>
